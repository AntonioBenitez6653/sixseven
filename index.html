<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIX SEVEN - PERSONAJE COMPLETO</title>
    <style>
        /* --- 1. NUEVO FONDO --- */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Fondo base radiactivo */
            background: radial-gradient(circle, #fff200, #ff5e00);
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
        }

        /* Efecto de explosión giratoria */
        .bg-burst {
            position: absolute;
            width: 200vmax;
            height: 200vmax;
            /* Rayos giratorios */
            background: repeating-conic-gradient(
                rgba(255, 255, 255, 0.3) 0deg 15deg,
                transparent 15deg 30deg
            );
            z-index: 0;
            animation: spin-bg 10s linear infinite;
        }

        /* --- 2. EL MUÑECO (CONTENEDOR PRINCIPAL) --- */
        .dude {
            position: relative;
            width: 350px;
            height: 550px; /* Aumentamos altura para las piernas */
            z-index: 10;
            
        }

        /* --- CABEZA --- */
        .head {
            width: 140px;
            height: 160px;
            background: #f1c27d;
            border: 5px solid #000;
            border-radius: 60px;
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            z-index: 5;
            /* Ritmo de la cabeza (0.3s) */
            animation: head-bop 0.3s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hair {
            width: 150px;
            height: 60px;
            background: #bb7445;
            border: 5px solid #000;
            border-bottom: 0;
            border-radius: 50px 50px 10px 10px;
            position: absolute;
            top: -15px;
            left: -10px;
        }

        .face {
            position: absolute;
            top: 50px;
            left: 20px;
            width: 100px;
        }

        .eyes {
            display: flex;
            justify-content: space-between;
        }

        .eye {
            width: 35px;
            height: 35px;
            background: #fff;
            border: 4px solid #000;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }

        .pupil {
            width: 12px;
            height: 12px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 10px;
            left: 10px;
        }

        .mouth {
            width: 50px;
            height: 30px;
            background: #660000;
            border: 4px solid #000;
            border-radius: 0 0 50px 50px;
            margin: 15px auto 0;
        }

        .tongue {
            width: 30px;
            height: 15px;
            background: #ff6666;
            border-radius: 50%;
            margin: 15px auto 0;
        }

        /* --- CUERPO --- */
        .body {
            width: 180px;
            height: 200px;
            background: #888;
            border: 5px solid #000;
            border-radius: 50px 50px 20px 20px;
            position: absolute;
            top: 140px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }

        /* --- NUEVO: PIERNAS Y PIES --- */
        .leg-container {
            position: absolute;
            top: 320px; /* Justo debajo del cuerpo */
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 1; /* Detrás del cuerpo */
            /* Animación de rebote sincronizada con la cabeza (0.3s) */
            animation: leg-bounce 0.3s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        .leg {
            width: 50px;
            height: 100px;
            background: #888; /* Color sudadera */
            border: 5px solid #000;
            position: relative;
        }
        .leg.left { border-radius: 0 0 10px 20px; }
        .leg.right { border-radius: 0 0 20px 10px; }

        /* Zapatillas */
        .foot {
            width: 75px;
            height: 40px;
            background: #8a0707; /* Zapatillas rojas */
            border: 5px solid #000;
            border-radius: 20px 40px 10px 15px;
            position: absolute;
            bottom: -20px;
        }
        /* Ajuste y rotación de los pies */
        .leg.left .foot { left: -25px; transform: rotate(-5deg); }
        .leg.right .foot { right: -25px; transform: scaleX(-1) rotate(-5deg); }


        /* --- BRAZOS --- */
        .arm-socket {
            position: absolute;
            top: 150px;
            width: 100%;
            height: 20px;
            z-index: 10; /* Los brazos van por delante de todo */
        }

        .arm {
            position: absolute;
            width: 150px;
            height: 45px;
            background: #888;
            border: 5px solid #000;
            border-radius: 25px;
            display: flex;
            align-items: center;
        }

        .hand {
            width: 60px;
            height: 60px;
            background: #f1c27d;
            border: 5px solid #000;
            border-radius: 50%;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .number {
            padding-bottom: 2rem;
            font-size: 100px;
            color: #ffe600;
            -webkit-text-stroke: 4px #000;
            position: absolute;
            bottom: 30px;
            font-weight: 900;
            text-shadow: 5px 5px 0 #000;
        }

        /* --- LÓGICA DE MOVIMIENTO (Tú código original) --- */
        .arm.left {
            left: -80px;
            transform-origin: right center;
            justify-content: flex-start;
            /* OJO: Mantengo tu velocidad original de 0.02s que es MUY rápida */
            animation: seesaw 0.2s infinite alternate ease-in-out;
        }
        .arm.left .hand { left: -30px; }

        .arm.right {
            right: -80px;
            transform-origin: left center;
            justify-content: flex-end;
            /* OJO: Mantengo tu velocidad original de 0.02s que es MUY rápida */
            animation: seesaw 0.2s infinite alternate ease-in-out;
        }
        .arm.right .hand { right: -30px; }

        /* --- TODAS LAS ANIMACIONES --- */

        /* Balanza de brazos */
        @keyframes seesaw {
            0% { transform: rotate(-35deg); } /* ARRIBA */
            100% { transform: rotate(35deg); } /* ABAJO */
        }

        /* Rebote de cabeza */
        @keyframes head-bop {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(15px); }
        }

        /* NUEVO: Rebote de piernas (sincronizado con la cabeza) */
        @keyframes leg-bounce {
            0%, 100% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(10px) scaleY(0.95); } /* Pequeña sentadilla */
        }

        /* NUEVO: Giro del fondo */
        @keyframes spin-bg {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="bg-burst"></div>

    <div class="dude">
        <div class="head">
            <div class="hair"></div>
            <div class="face">
                <div class="eyes">
                    <div class="eye"><div class="pupil"></div></div>
                    <div class="eye"><div class="pupil"></div></div>
                </div>
                <div class="mouth">
                    <div class="tongue"></div>
                </div>
            </div>
        </div>

        <div class="body"></div>

        <div class="leg-container">
            <div class="leg left">
                <div class="foot"></div>
            </div>
            <div class="leg right">
                <div class="foot"></div>
            </div>
        </div>

        <div class="arm-socket">
            <div class="arm left">
                <div class="hand">
                    <div class="number">6</div>
                </div>
            </div>
            <div class="arm right">
                <div class="hand">
                    <div class="number">7</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
